name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: cloudiamond-scratch selftest -v
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The sdist must be self-testable (it has to contain everything the tests need)
        run: |
          mkdir /tmp/sdist
          tar xzf dist/*.tar.gz -C /tmp/sdist
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install "$(echo /tmp/sdist/*)[test]"
          cd /tmp/sdist/*/
          /tmp/sdist-venv/bin/python -m pytest -q
      - name: Install the wheel in a clean environment and run the self test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/cloudiamond-scratch selftest -v
          /tmp/clean/bin/cloudiamond-scratch build --pub $(python -c "print('11'*32)") -o /tmp/x.sb3
          /tmp/clean/bin/cloudiamond-scratch audit /tmp/x.sb3
